<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fraternité Salon デモ</title>
<style>
:root{--paper:#f4efe4;--ink:#2b2420;--muted:#5e5750;--head:#2f4a3a;--rule:#c9c6b4}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:'Yu Gothic Medium','Yu Gothic',Meiryo,sans-serif}
header{padding:20px 16px;max-width:1400px;margin:auto;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
h1{font-family:'Yu Mincho',serif;font-size:22px;margin:0;color:var(--head)}
.sw{display:flex;gap:4px;background:#dfe3d3;border-radius:999px;padding:3px}
.sw input{position:absolute;opacity:0}.sw label{padding:8px 18px;border-radius:999px;cursor:pointer;min-height:40px;display:flex;align-items:center}
.sw input:checked+label{background:var(--head);color:var(--paper)}
main{max-width:1400px;margin:auto;padding:0 16px 40px;display:grid;gap:20px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
figure{margin:0;border:1px solid var(--rule);border-radius:14px;overflow:hidden;background:#fff}
figcaption{padding:10px 14px;font-size:14px;color:var(--head);border-bottom:1px solid var(--rule)}
img{display:none;width:100%;height:340px;object-fit:cover;object-position:top}
img:hover{object-fit:contain;background:#eee}
body:has(#w-pc:checked) img.pc,body:has(#w-ipad:checked) img.ipad,body:has(#w-phone:checked) img.phone{display:block}
footer{text-align:center;color:var(--muted);font-size:12px;padding-bottom:30px}
</style></head>
<body><header><h1>Fraternité Salon</h1><div class="sw"><input type="radio" name="w" id="w-pc" checked><label for="w-pc">PC</label><input type="radio" name="w" id="w-ipad"><label for="w-ipad">iPad</label><input type="radio" name="w" id="w-phone"><label for="w-phone">スマホ</label></div></header>
<main>
